<style>

*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#fff}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:Poppins,sans-serif;color:var(--ink);
 background:radial-gradient(1200px 700px at 15% 10%,#f3efff 0%,transparent 60%),radial-gradient(1000px 700px at 90% 90%,#fdf1f6 0%,transparent 60%),linear-gradient(180deg,#ffffff,#f7f8ff)}
.abs{position:absolute}
.blob{position:absolute;border-radius:50%;filter:blur(40px);opacity:.55}
.scene{position:absolute;inset:0;display:none}
svg [class]{transform-box:fill-box;transform-origin:center}
.card{position:absolute;left:150px;top:190px;width:600px;height:600px;border-radius:48px;background:#fff;
 box-shadow:0 30px 80px rgba(27,63,184,.16),0 4px 14px rgba(27,63,184,.08);display:flex;align-items:center;justify-content:center}
.card::before{content:"";position:absolute;inset:18px;border-radius:36px;background:linear-gradient(160deg,#f4f1ff,#fff 60%,#fff8e3)}
.card svg{position:relative;width:470px;height:470px;overflow:visible}
.badge{position:absolute;left:112px;top:150px;width:120px;height:120px;border-radius:50%;background:var(--navy);color:#fff;
 font-weight:800;font-size:64px;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 30px rgba(27,63,184,.35);border:6px solid #fff}
.right{position:absolute;left:860px;top:210px;width:950px}
.chip{display:inline-block;padding:10px 26px;border-radius:40px;background:var(--navy);color:#fff;font-weight:700;letter-spacing:6px;font-size:24px}
.step{font-weight:600;color:var(--grey);font-size:30px;margin-top:22px}
.title{font-weight:800;color:var(--navy);font-size:92px;line-height:1.02;margin-top:8px}
.sub{font-size:38px;color:var(--grey);margin-top:22px;font-weight:500}
.underline{height:12px;width:260px;border-radius:8px;background:var(--yellow);margin-top:18px;transform-origin:left center}
.tags{margin-top:40px;display:flex;flex-wrap:wrap;gap:18px}
.tag{padding:16px 28px;border-radius:22px;background:#fff;border:3px solid #dfe4fb;font-size:30px;font-weight:600;color:var(--navy2);box-shadow:0 8px 20px rgba(27,63,184,.08)}
.tag b{color:var(--yellow);-webkit-text-stroke:0;margin-right:10px}
.capbox{position:absolute;left:140px;right:140px;top:842px;height:122px;border-radius:30px;background:rgba(255,255,255,.92);
 box-shadow:0 14px 40px rgba(27,63,184,.12);border:2px solid #e6e9fb}
.cap{position:absolute;left:190px;right:190px;top:842px;height:122px;display:flex;align-items:center;justify-content:center;text-align:center;
 font-size:33px;line-height:1.3;font-weight:500;color:var(--ink)}
.cap strong{color:var(--navy);font-weight:700}
.capbar{position:absolute;left:140px;top:842px;width:14px;height:122px;border-radius:30px 0 0 30px;background:var(--yellow)}
/* header */
#logo{position:absolute;left:60px;top:42px;font-weight:800;font-size:40px;color:var(--navy)}
#logo i{font-family:Caveat,cursive;color:var(--yellow);font-style:normal;font-size:50px;margin:0 6px}
#phases{position:absolute;right:60px;top:52px;display:flex;gap:14px;align-items:center;font-weight:700;font-size:22px;letter-spacing:4px;color:#9aa3c7}
#phases .ar{color:var(--yellow)}
#phases span.on{color:var(--navy)}
/* timeline */
#tl{position:absolute;left:0;top:990px;width:1920px;height:80px}
#tl svg{position:absolute;inset:0}
.dot{position:absolute;top:22px;width:34px;height:34px;margin-left:-17px;border-radius:50%;background:#fff;border:6px solid var(--yellow)}
.dot.done{background:var(--navy);border-color:var(--navy)}
.dot.cur{background:var(--yellow);border-color:#fff;box-shadow:0 0 0 6px var(--yellow),0 6px 20px rgba(247,198,60,.7)}
/* intro */
.big{font-weight:800;font-size:200px;color:var(--navy);letter-spacing:-4px;line-height:1}
.to{font-family:Caveat,cursive;color:var(--yellow);font-size:230px;font-weight:700}
.chain{display:flex;gap:26px;align-items:center;font-weight:600;letter-spacing:10px;font-size:34px;color:var(--navy2)}
.chain .ar{color:var(--yellow);font-size:40px;letter-spacing:0}
.bubble{position:absolute;padding:30px 40px;border-radius:40px;background:var(--pink);font-family:Caveat,cursive;font-size:56px;line-height:1.05;color:var(--navy2);text-align:center}
.hand{font-family:Caveat,cursive;color:var(--navy2)}
.center{position:absolute;left:0;right:0;text-align:center}
.pill{display:inline-block;padding:22px 48px;border-radius:60px;font-weight:800;font-size:54px;letter-spacing:8px;color:#fff;background:var(--navy);box-shadow:0 16px 40px rgba(27,63,184,.3)}

const E={lin:p=>p,out:p=>1-Math.pow(1-p,3),inout:p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2,
 back:p=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2)},
 el:p=>p===0||p===1?p:Math.pow(2,-10*p)*Math.sin((p*10-.75)*(2*Math.PI/3))+1};
const TW=new Map(), LOOPS=[], SHOWS=[];
const DEF={o:1,x:0,y:0,s:1,r:0,sx:1,sy:1};
function tw(el,t0,d,from,to,ease='out'){ if(!el)return; if(!TW.has(el))TW.set(el,[]);
 TW.get(el).push({t0,d,from,to,ease:E[ease]||E.out}); }
function loop(el,fn){LOOPS.push({el,fn})}
function show(el,a,b){SHOWS.push({el,a,b})}
function seek(t){
 for(const s of SHOWS){ s.el.style.display=(t>=s.a&&t<s.b)?'block':'none'; }
 for(const [el,list] of TW){
  const st={...DEF}; const seen={};
  const sorted=list.slice().sort((a,b)=>a.t0-b.t0);
  for(const k of Object.keys(DEF)){
   const ts=sorted.filter(w=>k in w.to); if(!ts.length)continue;
   if(t<ts[0].t0){ st[k]=(k in ts[0].from)?ts[0].from[k]:DEF[k]; continue; }
   let w=ts[0]; for(const x of ts) if(x.t0<=t) w=x;
   const p=w.d<=0?1:Math.min(1,Math.max(0,(t-w.t0)/w.d)); const f=(k in w.from)?w.from[k]:st[k];
   st[k]=f+(w.to[k]-f)*w.ease(p);
  }
  el.style.opacity=st.o;
  el.style.transform=`translate(${st.x}px,${st.y}px) rotate(${st.r}deg) scale(${st.s*st.sx},${st.s*st.sy})`;
 }
 for(const l of LOOPS) l.fn(l.el,t);
}
window.seek=seek;

 tw(bar,s.start+.3,.6,{o:0,y:40},{o:1,y:0});

 caps.forEach((c,i)=>{const ce=$(`<div class="cap"><span>${c}</span></div>`);el.appendChild(ce);

const tl=document.getElementById('tl'); const X0=260,X1=1660;
const xs=Array.from({length:9},(_,i)=>X0+(X1-X0)*i/8);
tl.innerHTML=`<svg width="1920" height="80"><path id="wave" d="M${X0-120} 39 ${xs.map((x,i)=>`Q ${x-87} ${i%2?20:58} ${x} 39`).join(' ')} T ${X1+120} 39" stroke="#f7c63c" stroke-width="7" fill="none" stroke-linecap="round" opacity=".45"/>
 <path id="wave2" d="M${X0-120} 39 ${xs.map((x,i)=>`Q ${x-87} ${i%2?20:58} ${x} 39`).join(' ')} T ${X1+120} 39" stroke="#f7c63c" stroke-width="9" fill="none" stroke-linecap="round"/></svg>`+
 xs.map((x,i)=>`<div class="dot" style="left:${x}px"></div>`).join('');
const w2=tl.querySelector('#wave2'); const len=w2.getTotalLength(); w2.style.strokeDasharray=len;
const dots=[...tl.querySelectorAll('.dot')];
loop(hud,(e,t)=>{ let cur=-1; stepScenes.forEach((s,i)=>{if(t>=s.start)cur=i});
 dots.forEach((d,i)=>{d.className='dot'+(i<cur?' done':i===cur?' cur':'');
  const sc=i===cur?1.25+.08*Math.sin(t*5):1; d.style.transform=`scale(${sc})`;});
 // progress along wave
 const ci=Math.max(cur,0), s=stepScenes[ci]; const p=E.out(Math.min(1,Math.max(0,(t-s.start)/.9)));
 const xPrev=ci>0?xs[ci-1]:X0-120; const xNow=xPrev+(xs[ci]-xPrev)*p; const target=(xNow-(X0-120))/(X1-X0+240);
 w2.style.strokeDashoffset=len*(1-Math.min(1,target));
 const ph=cur>=0?STEPS[cur].ph:0; phs.querySelectorAll('span[data-i]').forEach(sp=>sp.classList.toggle('on',+sp.dataset.i===ph));
});
